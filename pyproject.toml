[project]
name = "adk-agent-template"
version = "0.1.0"
description = "Production-ready ADK agent template with best practices"
requires-python = ">=3.12,<4.0"
dependencies = [
    "ddtrace==4.8.2",
    "dotenv>=0.9.9",
    # ddtrace 4.8.2 uses the ADK 2.6 tool instrumentation API.
    "google-adk>=2.6.1,<2.7.0",
    "gunicorn>=23.0.0",
    "jinja2>=3.1.6",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.10.0",
    "python-frontmatter>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "N",  # pep8-naming
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["src/test"]
python_files = "test_*.py"
python_functions = "should_*"
asyncio_mode = "auto"
env = [
    "D:GOOGLE_GENAI_USE_VERTEXAI=true",
    "D:GOOGLE_CLOUD_PROJECT=test-project",
    "D:GOOGLE_CLOUD_LOCATION=us-central1",
    "D:LOG_LEVEL=ERROR",
    "D:DEBUG=true",
]

[dependency-groups]
dev = [
    "faker>=37.4.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
    "ruff>=0.14.7",
]
